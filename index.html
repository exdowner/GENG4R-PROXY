<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#07040d">
    <title>GENG4R PROXY - Advanced Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #07040d;
            --purple: #9d33ff;
            --purple-light: #c27aff;
            --purple-deep: #5513ab;
            --purple-glow: rgba(157, 51, 255, 0.4);
            --border-glass: rgba(255, 255, 255, 0.14);
            --border-active: rgba(157, 51, 255, 0.6);
            --text-main: #f3f0f7;
            --text-muted: rgba(243, 240, 247, 0.45);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            min-height: 100dvh;
            background: var(--bg-deep) url('fundo.png') center/cover no-repeat fixed;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 40px;
            color: var(--text-main);
            position: relative;
        }

        /* Camadas de profundidade e iluminação assimétrica */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(110, 20, 200, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(60, 10, 120, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, rgba(5, 3, 10, 0.7) 0%, rgba(10, 6, 20, 0.85) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Grade cibernética sutil de fundo */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
            pointer-events: none;
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--purple-light);
            border-radius: 50%;
            animation: float linear infinite;
            box-shadow: 0 0 8px var(--purple);
        }

        @keyframes float {
            0% {
                transform: translateY(105vh) translateX(0) scale(0.3);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) translateX(30px) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: containerEntry 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes containerEntry {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== LOGO HEADER AVANÇADO ===== */
        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 16px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-emblem {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, rgba(157, 51, 255, 0.3), rgba(85, 19, 171, 0.1));
            border: 1px solid var(--border-active);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(157, 51, 255, 0.25);
        }

        .logo-emblem svg {
            width: 22px;
            height: 22px;
            fill: var(--purple-light);
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .logo-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff, #c27aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-subtitle {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .system-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.25);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #4ade80;
            letter-spacing: 0.5px;
        }

        .system-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* ===== CARD PRINCIPAL ===== */
        .card {
            width: 100%;
            background: rgba(14, 9, 24, 0.65);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(194, 122, 255, 0.5), transparent);
        }

        /* ===== INPUT SECTION ===== */
        .input-section {
            margin-bottom: 22px;
        }

        .input-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .input-wrap label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .input-status-hint {
            font-size: 0.65rem;
            color: var(--purple-light);
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus-within {
            border-color: var(--border-active);
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 4px rgba(157, 51, 255, 0.12), 0 0 20px rgba(157, 51, 255, 0.2);
        }

        .input-icon-left {
            padding-left: 16px;
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }

        .input-icon-left svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .input-field input {
            flex: 1;
            padding: 18px 16px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.05rem;
            letter-spacing: 3px;
            outline: none;
            font-family: inherit;
            min-width: 0;
        }

        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
            font-size: 0.85rem;
        }

        /* ===== BOTÕES DE AÇÃO ===== */
        .btn-row {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }

        .btn {
            position: relative;
            width: 100%;
            padding: 16px 18px;
            border: none;
            border-radius: 16px;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            overflow: hidden;
            color: #fff;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.3s ease,
                background 0.3s ease;
            -webkit-user-select: none;
            user-select: none;
            text-transform: uppercase;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.35) 0%,
                    rgba(255, 255, 255, 0.03) 50%,
                    rgba(255, 255, 255, 0.15) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(157, 51, 255, 0.35), rgba(85, 19, 171, 0.5));
            border: 1px solid rgba(157, 51, 255, 0.5);
            box-shadow: 0 8px 25px rgba(157, 51, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(157, 51, 255, 0.5), rgba(85, 19, 171, 0.7));
            box-shadow: 0 10px 35px rgba(157, 51, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-content svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            flex-shrink: 0;
        }

        /* ===== MENSAGEM DE ERRO ===== */
        .error-msg {
            height: 0;
            overflow: hidden;
            color: #ff6b8b;
            font-size: 0.78rem;
            text-align: center;
            margin-top: 0;
            opacity: 0;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .error-msg.show {
            height: 24px;
            margin-top: 14px;
            opacity: 1;
        }

        /* ===== TELA MANUTENÇÃO / PAINEL SECUNDÁRIO ===== */
        .maint-wrapper {
            width: 100%;
            animation: maintIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes maintIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .maint-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 24px;
        }

        .maint-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .maint-brand-icon {
            width: 34px;
            height: 34px;
            background: rgba(157, 51, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(157, 51, 255, 0.4);
        }

        .maint-brand-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--purple-light);
        }

        .maint-brand-text {
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff, #c27aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .maint-version {
            font-size: 0.68rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 600;
        }

        .maint-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }

        .maint-icon-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
        }

        .maint-icon-bg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(157, 51, 255, 0.35), rgba(85, 19, 171, 0.1));
            border: 1.5px solid rgba(157, 51, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: iconPulse 2.5s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(157, 51, 255, 0.3); }
            50% { box-shadow: 0 0 0 16px rgba(157, 51, 255, 0); }
        }

        .maint-icon-bg svg {
            width: 38px;
            height: 38px;
            fill: var(--purple-light);
        }

        .maint-title {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .maint-sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: center;
            max-width: 320px;
            margin: 0 auto 24px;
        }

        .maint-sub strong {
            color: var(--text-main);
        }

        .maint-spinner {
            margin-top: 10px;
        }

        .spinner-ring {
            width: 36px;
            height: 36px;
            position: relative;
            margin: 0 auto;
        }

        .spinner-ring div {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: var(--purple-light);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        .spinner-ring div:nth-child(2) {
            border-top-color: transparent;
            border-right-color: rgba(157, 51, 255, 0.3);
            animation-duration: 1.2s;
            animation-direction: reverse;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== TOAST DE NOTIFICAÇÃO ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(70px);
            background: rgba(10, 6, 18, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 22px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #4ade80;
            stroke-width: 2.5;
            flex-shrink: 0;
        }

        .screen {
            display: none;
            width: 100%;
        }

        .screen.active {
            display: block;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 520px) {
            body {
                padding: 16px;
                align-items: center;
                justify-content: center;
            }
            .container {
                max-width: 100%;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }
    </style>
</head>

    <div class="container">
        <!-- LOGO HEADER SUPERIOR -->

                <div class="logo-emblem">

                        <div class="maint-brand">

                                </svg>

                            <strong>Aguarde alguns minutos</strong> e tente o acesso novamente.

                        <div class="maint-spinner">
                            <div class="spinner-ring">

        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24">
            <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="toastMessage">Ação efetuada com sucesso!</span>
    </div>

    <script>
        // ===== MOTOR DE PARTÍCULAS DINÂMICO =====
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = 22;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (10 + Math.random() * 15) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                const size = (1.5 + Math.random() * 2.5) + 'px';
                p.style.width = size;
                p.style.height = size;
                container.appendChild(p);
            }
        })();

        // ===== ELEMENTOS DOM =====
        const passwordInput = document.getElementById('passwordInput');
        const confirmBtn = document.getElementById('confirmBtn');
        const getKeyBtn = document.getElementById('getKeyBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loginScreen = document.getElementById('loginScreen');
        const maintenanceScreen = document.getElementById('maintenanceScreen');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        let toastTimeout = null;

        // ===== SISTEMA DE TOAST =====
        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== EFEITO RIPPLE NOS BOTÕES =====
        function createRipple(e, btn) {
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left + rect.width / 2);
            const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : rect.top + rect.height / 2);
            const x = clientX - rect.left - size / 2;
            const y = clientY - rect.top - size / 2;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        // ===== VALIDAÇÃO DE CHAVE =====
        function validateKey(key) {
            return key.trim().toUpperCase().startsWith('GEN');
        }

        // ===== EVENTO DE CONFIRMAR =====
        confirmBtn.addEventListener('click', (e) => {
            createRipple(e, confirmBtn);

            const value = passwordInput.value.trim();
            if (!value) {
                errorMsg.textContent = 'Por favor, insira a chave de acesso.';
                errorMsg.classList.add('show');
                passwordInput.focus();
                passwordInput.style.animation = 'none';
                passwordInput.offsetHeight;
                passwordInput.style.animation = 'shake 0.4s ease';
                return;
            }

            if (!validateKey(value)) {
                errorMsg.textContent = 'Chave inválida ou expirada no sistema.';
                errorMsg.classList.add('show');
                passwordInput.focus();
                passwordInput.style.animation = 'none';
                passwordInput.offsetHeight;
                passwordInput.style.animation = 'shake 0.4s ease';
                return;
            }

            errorMsg.classList.remove('show');

            loginScreen.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            loginScreen.style.opacity = '0';
            loginScreen.style.transform = 'scale(0.95) translateY(-10px)';

            setTimeout(() => {
                loginScreen.classList.remove('active');
                loginScreen.style.opacity = '';
                loginScreen.style.transform = '';
                maintenanceScreen.classList.add('active');
                showToast('Autenticação bem-sucedida!');
            }, 350);
        });

        // ===== EVENTO GET KEY =====
        getKeyBtn.addEventListener('click', (e) => {
            createRipple(e, getKeyBtn);
            window.open('https://alpharede.com/wD3DOEBVsRd', '_blank');
            showToast('Direcionando para o gerador de chaves...');
        });

        // ===== ATALHOS E UTILITÁRIOS =====
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') confirmBtn.click();
        });

        passwordInput.addEventListener('input', () => {
            if (errorMsg.classList.contains('show')) {
                errorMsg.classList.remove('show');
            }
        });
    </script>
</body>
</html>
