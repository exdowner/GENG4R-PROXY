<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0612">
    <title>GENG4R PROXY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --purple: #b44aff;
            --purple-glow: rgba(180, 74, 255, 0.55);
            --purple-deep: #7a1fd4;
            --border-glass: rgba(255, 255, 255, 0.22);
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            min-height: 100dvh;
            background: #0a0612 url('fundo.png') center/cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 40%, rgba(90, 20, 160, 0.3) 0%, transparent 60%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.55) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(180, 74, 255, 0.5);
            border-radius: 50%;
            animation: float linear infinite;
            box-shadow: 0 0 6px var(--purple-glow);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.4);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrap {
            margin-bottom: 28px;
            text-align: center;
            animation: logoIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes logoIn {
            from {
                opacity: 0;
                transform: translateY(-24px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-svg {
            width: min(280px, 78vw);
            height: auto;
            filter: drop-shadow(0 0 18px rgba(180, 74, 255, 0.45));
        }

        .logo-glow {
            animation: pulseGlow 3.2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 12px rgba(180, 74, 255, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 26px rgba(180, 74, 255, 0.75));
            }
        }

        /* CARD */
        .card {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            border: 1px solid var(--border-glass);
            border-radius: 22px;
            padding: 28px 22px 26px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            animation: cardIn 0.85s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 22px;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 0.3px;
        }

        /* INPUT */
        .input-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .input-wrap label {
            display: block;
            font-size: 0.72rem;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .input-field {
            position: relative;
        }

        .input-field input {
            width: 100%;
            padding: 15px 48px 15px 16px;
            background: rgba(255, 255, 255, 0.09);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            color: #fff;
            font-size: 1.05rem;
            letter-spacing: 2px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.32);
            letter-spacing: 1px;
            font-size: 0.95rem;
        }

        .input-field input:focus {
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(180, 74, 255, 0.65);
            box-shadow: 0 0 0 4px rgba(180, 74, 255, 0.15), 0 4px 20px rgba(180, 74, 255, 0.12);
        }

        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            opacity: 0.45;
            transition: opacity 0.25s, color 0.25s;
            pointer-events: none;
            color: #fff;
        }

        .input-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        /* Botão Paste (Colar) */
        .paste-btn {
            position: absolute;
            right: 52px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            padding: 0;
            color: rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        .paste-btn:hover {
            background: rgba(180, 74, 255, 0.2);
            border-color: rgba(180, 74, 255, 0.4);
            color: rgba(255, 255, 255, 0.8);
        }

        .paste-btn:active {
            transform: translateY(-50%) scale(0.92);
        }

        .paste-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* BOTÃO LIQUID GLASS */
        .btn {
            position: relative;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 650;
            letter-spacing: 0.4px;
            cursor: pointer;
            overflow: hidden;
            color: #fff;
            background: rgba(180, 74, 255, 0.15);
            backdrop-filter: blur(12px) saturate(1.6);
            -webkit-backdrop-filter: blur(12px) saturate(1.6);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.3s ease,
                background 0.3s ease;
            -webkit-user-select: none;
            user-select: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.5) 0%,
                    rgba(255, 255, 255, 0.05) 30%,
                    rgba(255, 255, 255, 0.15) 50%,
                    rgba(255, 255, 255, 0.02) 80%,
                    rgba(255, 255, 255, 0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 55%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.25) 0%,
                    rgba(255, 255, 255, 0.05) 60%,
                    transparent 100%);
            border-radius: 14px 14px 0 0;
            pointer-events: none;
        }

        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(3.2);
                opacity: 0;
            }
        }

        .btn:active {
            transform: scale(0.97);
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: rgba(180, 74, 255, 0.25);
            border: 1px solid rgba(180, 74, 255, 0.4);
            box-shadow:
                0 8px 32px rgba(140, 40, 220, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(255, 255, 255, 0.1);
        }

        .btn-primary::before {
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.6) 0%,
                    rgba(180, 74, 255, 0.15) 30%,
                    rgba(255, 255, 255, 0.2) 50%,
                    rgba(180, 74, 255, 0.05) 80%,
                    rgba(255, 255, 255, 0.4) 100%);
        }

        .btn-primary:hover {
            background: rgba(180, 74, 255, 0.35);
            box-shadow:
                0 8px 40px rgba(140, 40, 220, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ERRO */
        .error-msg {
            height: 0;
            overflow: hidden;
            color: #ff7a9a;
            font-size: 0.82rem;
            text-align: center;
            margin-top: 0;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .error-msg.show {
            height: 22px;
            margin-top: 12px;
            opacity: 1;
        }

        /* TELAS */
        .screen {
            display: none;
            width: 100%;
        }

        .screen.active {
            display: block;
        }

        /* ===== TELA MANUTENÇÃO ===== */
        .maint-wrapper {
            width: 100%;
            animation: maintIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes maintIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .maint-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0 22px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 24px;
        }

        .maint-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .maint-brand-icon {
            width: 28px;
            height: 28px;
            background: rgba(180, 74, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(180, 74, 255, 0.3);
        }

        .maint-brand-icon svg {
            width: 18px;
            height: 18px;
            fill: #d4a0ff;
        }

        .maint-brand-text {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #e0b0ff, #b44aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .maint-version {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 500;
            letter-spacing: 0.5px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
        }

        .maint-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0 8px 0;
        }

        .maint-icon-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
        }

        .maint-icon-bg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(200, 120, 255, 0.3), rgba(120, 40, 200, 0.1));
            border: 1.5px solid rgba(180, 74, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: iconPulse 2.4s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(180, 74, 255, 0.25);
            }
            50% {
                box-shadow: 0 0 0 14px rgba(180, 74, 255, 0);
            }
        }

        .maint-icon-bg svg {
            width: 38px;
            height: 38px;
            fill: #d4a0ff;
        }

        .maint-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #fff, #d4a0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .maint-sub {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.92rem;
            line-height: 1.6;
            text-align: center;
            max-width: 280px;
            margin: 0 auto 4px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.6);
        }

        .maint-sub strong {
            color: rgba(255, 255, 255, 0.85);
            -webkit-text-fill-color: rgba(255, 255, 255, 0.85);
        }

        .maint-spinner {
            margin-top: 28px;
        }

        .spinner-ring {
            width: 36px;
            height: 36px;
            position: relative;
            margin: 0 auto;
        }

        .spinner-ring div {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #c97bff;
            border-radius: 50%;
            animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        .spinner-ring div:nth-child(2) {
            border-top-color: transparent;
            border-right-color: rgba(180, 74, 255, 0.3);
            animation-duration: 1.3s;
            animation-direction: reverse;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 22px;
            color: #fff;
            font-size: 0.82rem;
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #4ade80;
            stroke-width: 2.5;
            flex-shrink: 0;
        }

        /* RESPONSIVO */
        @media (max-width: 380px) {
            .container {
                padding: 16px 14px;
            }
            .logo-svg {
                width: 88vw;
            }
            .card {
                padding: 24px 18px 22px;
                border-radius: 18px;
            }
            .card-title {
                font-size: 1rem;
            }
            .maint-brand-text {
                font-size: 0.95rem;
            }
            .maint-title {
                font-size: 1.3rem;
            }
            .paste-btn {
                right: 46px;
                width: 24px;
                height: 24px;
            }
            .paste-btn svg {
                width: 14px;
                height: 14px;
            }
        }

        @media (max-height: 640px) {
            .logo-wrap {
                margin-bottom: 16px;
            }
            .logo-svg {
                width: min(240px, 70vw);
            }
            .card {
                padding: 20px 18px;
            }
            .maint-header {
                padding: 12px 0 16px 0;
                margin-bottom: 16px;
            }
            .maint-icon-wrap {
                width: 64px;
                height: 64px;
                margin-bottom: 16px;
            }
            .maint-icon-bg svg {
                width: 30px;
                height: 30px;
            }
            .paste-btn {
                right: 46px;
                width: 24px;
                height: 24px;
            }
            .paste-btn svg {
                width: 14px;
                height: 14px;
            }
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .container {
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- LOGO -->
        <div class="logo-wrap logo-glow">
            <svg class="logo-svg" viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e0b0ff"/>
                        <stop offset="50%" stop-color="#b44aff"/>
                        <stop offset="100%" stop-color="#7a1fd4"/>
                    </linearGradient>
                    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="2.5" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <text x="160" y="48" text-anchor="middle" font-size="42" font-weight="900" letter-spacing="1" filter="url(#softGlow)" font-family="Arial Black, Helvetica Neue, sans-serif">
                    <tspan fill="url(#purpleGrad)">G</tspan><tspan fill="#d9a8ff">E</tspan><tspan fill="#c97bff">N</tspan><tspan fill="#b44aff">G</tspan><tspan fill="#e8c4ff" font-size="38" dy="-2">4</tspan><tspan fill="#b44aff" dy="2">R</tspan>
                </text>
                <text x="160" y="78" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="8" fill="rgba(255,255,255,0.85)" font-family="Arial, Helvetica, sans-serif">PROXY</text>
                <line x1="95" y1="84" x2="225" y2="84" stroke="url(#purpleGrad)" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- TELA LOGIN -->
        <div id="loginScreen" class="screen active">
            <div class="card">
                <div class="card-title">Acesso</div>
                <div class="input-wrap">
                    <label for="passwordInput">Chave de acesso</label>
                    <div class="input-field">
                        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="off" spellcheck="false" inputmode="text">
                        <button class="paste-btn" id="pasteBtn" type="button" aria-label="Colar">
                            <svg viewBox="0 0 24 24">
                                <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" fill="none"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" fill="none"/>
                            </svg>
                        </button>
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                        </span>
                    </div>
                </div>
                <button class="btn btn-primary" id="confirmBtn" type="button">
                    <span class="btn-content">Confirmar</span>
                </button>
                <div class="error-msg" id="errorMsg">Chave inválida ou expirada</div>
            </div>
        </div>

        <!-- TELA MANUTENÇÃO -->
        <div id="maintenanceScreen" class="screen">
            <div class="card" style="padding: 20px 22px 26px;">
                <div class="maint-wrapper">
                    <div class="maint-header">
                        <div class="maint-brand">
                            <div class="maint-brand-icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                                </svg>
                            </div>
                            <span class="maint-brand-text">GENG4R PROXY</span>
                        </div>
                        <span class="maint-version">1.0.0</span>
                    </div>

                    <div class="maint-body">
                        <div class="maint-icon-wrap">
                            <div class="maint-icon-bg">
                                <svg viewBox="0 0 24 24">

    <!-- TOAST -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24">
            <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="toastMessage">Texto colado!</span>
    </div>

    <script>
        // ===== PARTICLES =====
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = window.innerWidth < 400 ? 12 : 18;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
                container.appendChild(p);
            }
        })();

        // ===== DOM =====
        const passwordInput = document.getElementById('passwordInput');
        const confirmBtn = document.getElementById('confirmBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loginScreen = document.getElementById('loginScreen');
        const maintenanceScreen = document.getElementById('maintenanceScreen');
        const pasteBtn = document.getElementById('pasteBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        let toastTimeout = null;

        // ===== TOAST =====
        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ===== PASTE =====
        pasteBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();

            try {
                // Tenta usar a API de clipboard
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        passwordInput.value = text;
                        passwordInput.focus();
                        passwordInput.dispatchEvent(new Event('input', { bubbles: true }));
                        showToast('Texto colado!');
                        return;
                    }
                }

                // Fallback: tenta usar o método antigo com input invisível
                const tempInput = document.createElement('input');
                tempInput.style.position = 'fixed';
                tempInput.style.left = '-9999px';
                tempInput.style.top = '-9999px';
                tempInput.style.opacity = '0';
                document.body.appendChild(tempInput);
                tempInput.focus();

                // Tenta colar via evento
                const pasteEvent = new ClipboardEvent('paste', {
                    clipboardData: new DataTransfer(),
                    bubbles: true,
                    cancelable: true
                });

                // Simula o paste
                tempInput.dispatchEvent(pasteEvent);

                // Se não funcionou, tenta via execCommand
                if (!tempInput.value) {
                    // Fallback: instrui o usuário
                    showToast('Use Ctrl+V para colar');
                    passwordInput.focus();
                    document.body.removeChild(tempInput);
                    return;
                }

                passwordInput.value = tempInput.value;
                passwordInput.focus();
                passwordInput.dispatchEvent(new Event('input', { bubbles: true }));
                document.body.removeChild(tempInput);
                showToast('Texto colado!');

            } catch (err) {
                // Fallback final: instrui o usuário
                showToast('Use Ctrl+V para colar');
                passwordInput.focus();
            }
        });

        // ===== RIPPLE =====
        function createRipple(e, btn) {
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left + rect.width / 2);
            const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : rect.top + rect.height / 2);
            const x = clientX - rect.left - size / 2;
            const y = clientY - rect.top - size / 2;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        // ===== VALIDAÇÃO =====
        function validateKey(key) {
            return key.trim().toUpperCase().startsWith('GEN');
        }

        // ===== CONFIRMAR =====
        confirmBtn.addEventListener('click', (e) => {
            createRipple(e, confirmBtn);

            const value = passwordInput.value.trim();
            if (!value) {
                errorMsg.textContent = 'Por favor, insira a chave de acesso.';
                errorMsg.classList.add('show');
                passwordInput.focus();
                passwordInput.style.animation = 'none';
                passwordInput.offsetHeight;
                passwordInput.style.animation = 'shake 0.4s ease';
                return;
            }

            if (!validateKey(value)) {
                errorMsg.textContent = 'Chave inválida ou expirada.';
                errorMsg.classList.add('show');
                passwordInput.focus();
                passwordInput.style.animation = 'none';
                passwordInput.offsetHeight;
                passwordInput.style.animation = 'shake 0.4s ease';
                return;
            }

            errorMsg.classList.remove('show');

            loginScreen.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
            loginScreen.style.opacity = '0';
            loginScreen.style.transform = 'scale(0.96) translateY(-8px)';

            setTimeout(() => {
                loginScreen.classList.remove('active');
                loginScreen.style.opacity = '';
                loginScreen.style.transform = '';
                maintenanceScreen.classList.add('active');
            }, 320);
        });

        // ===== ENTER =====
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') confirmBtn.click();
        });

        // ===== INPUT =====
        passwordInput.addEventListener('input', () => {
            if (errorMsg.classList.contains('show')) {
                errorMsg.classList.remove('show');
            }
        });

        // ===== KEYBOARD SHORTCUT CTRL+V =====
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
                // Se o foco está no input, deixa o navegador lidar
                if (document.activeElement === passwordInput) {
                    // O navegador vai lidar com o paste normalmente
                    // Mas vamos mostrar um feedback depois que o paste acontecer
                    setTimeout(() => {
                        if (passwordInput.value) {
                            showToast('Texto colado!');
                        }
                    }, 100);
                }
            }
        });

        console.log('🔐 GENG4R PROXY - Botão de colar ativado!');
    </script>
</body>
